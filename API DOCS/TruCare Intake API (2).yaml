                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    put:
      operationId: admin_billers_update
      description: Partially or fully update a billing account. Admin-only endpoint.
      summary: Update biller
      parameters:
      - in: path
        name: biller_id
        schema:
          type: integer
        required: true
      tags:
      - Admin Staff
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BillingUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BillingUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
