                $ref: '#/components/schemas/RoleAccountRead'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    patch:
      operationId: admin_billers_partial_update
      description: Partially update a billing account. Admin-only endpoint.
      summary: Patch biller
      parameters:
      - in: path
        name: biller_id
        schema:
          type: integer
        required: true
      tags:
      - Admin Staff
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBillingUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBillingUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBillingUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAccountRead'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    delete:
      operationId: admin_billers_destroy
      description: Delete a billing account and profile. Admin-only endpoint.
      summary: Delete biller
      parameters:
      - in: path
        name: biller_id
        schema:
          type: integer
        required: true
      tags:
      - Admin Staff
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
