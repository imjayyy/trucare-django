openapi: 3.0.3
info:
  title: TruCare Intake API
  version: 1.0.0
  description: API for retrieving and submitting intake forms.
paths:
  /api/admin/billers/:
    get:
      operationId: admin_billers_list
      description: Return all billing accounts. Admin-only endpoint.
      summary: List billers
      parameters:
      - in: query
        name: search
        schema:
          type: string
        description: Search by username, email, first name, or last name.
      tags:
      - Admin Staff
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoleAccountRead'
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
    post:
      operationId: admin_billers_create
      description: Create a billing account and profile. Admin-only endpoint.
      summary: Create biller
      tags:
      - Admin Staff
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingWrite'
            examples:
              CreateBillerPayload:
                value:
                  username: billing_one
                  email: billing@example.com
                  password: StrongPass123!
                  first_name: Jordan
                  last_name: Lee
                summary: Create biller payload
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BillingWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BillingWrite'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleAccountRead'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/admin/billers/{biller_id}/:
    get:
      operationId: admin_billers_retrieve
      description: Retrieve one billing account by id. Admin-only endpoint.
      summary: Get biller
      parameters:
