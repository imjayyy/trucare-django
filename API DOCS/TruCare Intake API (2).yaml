components:
  schemas:
    BillingUpdate:
      type: object
      properties:
        username:
          type: string
          maxLength: 150
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
          minLength: 8
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
    BillingWrite:
      type: object
      properties:
        username:
          type: string
          description: Unique login username.
          maxLength: 150
        email:
          type: string
          format: email
          description: Account email.
        password:
          type: string
          writeOnly: true
          description: Minimum 8 characters.
          minLength: 8
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
      required:
      - email
      - password
      - username
    BlankEnum:
      enum:
      - ''
    ClientFinanceRead:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        client_id:
          type: integer
          readOnly: true
        username:
          type: string
          readOnly: true
