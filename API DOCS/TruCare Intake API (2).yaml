              CreateDoctorPayload:
                value:
                  username: doctor_alex
                  email: alex@example.com
                  password: StrongPass123!
                  first_name: Alex
                  last_name: Rivera
                  phone_number: '5551234567'
                  address: 100 Main St
                  state: CA
                  postal_code: '94105'
                  npi: '1234567890'
